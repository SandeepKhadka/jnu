<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="Campus photograph placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4480"/>
      <stop offset="60%" stop-color="#2d81c8"/>
      <stop offset="100%" stop-color="#6fa8d8"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8863a"/>
      <stop offset="100%" stop-color="#a86d2b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="560" fill="url(#sky)"/>

  <!-- Jodhpur skyline suggestion: sandstone blocks and a fort silhouette. -->
  <path d="M0 470 L180 470 L180 360 L280 300 L380 360 L380 470 L1600 470 L1600 560 L0 560 Z" fill="url(#stone)" opacity="0.9"/>
  <rect x="520" y="330" width="220" height="140" fill="#8f5c24" opacity="0.85"/>
  <rect x="800" y="290" width="180" height="180" fill="#a86d2b" opacity="0.85"/>
  <rect x="1050" y="350" width="260" height="120" fill="#8f5c24" opacity="0.8"/>

  <g fill="#f4ead9" opacity="0.55">
    <rect x="556" y="366" width="26" height="38"/><rect x="606" y="366" width="26" height="38"/>
    <rect x="656" y="366" width="26" height="38"/><rect x="836" y="326" width="26" height="38"/>
    <rect x="886" y="326" width="26" height="38"/><rect x="1086" y="386" width="26" height="38"/>
    <rect x="1136" y="386" width="26" height="38"/><rect x="1186" y="386" width="26" height="38"/>
  </g>

  <text x="800" y="180" font-family="Trebuchet MS, Arial, sans-serif" font-size="34"
        fill="#ffffff" opacity="0.85" text-anchor="middle" letter-spacing="3">
    CAMPUS PHOTOGRAPH
  </text>
  <text x="800" y="222" font-family="Arial, sans-serif" font-size="18"
        fill="#d6e7f5" opacity="0.8" text-anchor="middle">
    Replace with campus-hero.avif / .webp / .jpg at 1600px wide, under ~150 KB
  </text>
</svg>
