# Render blueprint.
#
# The disk is the reason this app is on Render rather than a serverless host.
# Admin uploads (logo, photographs, affiliation and syllabus PDFs) and
# applicant documents are written to a real filesystem by src/lib/media.ts and
# src/lib/storage.ts. On an ephemeral filesystem they survive a few minutes
# and then vanish, which looks like the upload worked and then silently did
# not — see HANDOFF.md section 14.
#
# The DATABASE is deliberately NOT on this disk. `npm run build` runs
# `prisma migrate deploy` and the seed, and a disk is not reliably mounted
# during a build; an external Postgres is reachable at both build and run time.
#
# NOTE: disks require a paid instance type. A free instance cannot mount one.

services:
  - type: web
    name: jnu
    runtime: node
    plan: starter
    branch: master
    buildCommand: npm ci && npm run build
    # -H 0.0.0.0 is explicit rather than relying on the default; Render sets PORT.
    startCommand: npm start -- -H 0.0.0.0
    healthCheckPath: /
    disk:
      name: jnu-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Neon / Supabase / any managed Postgres connection string.
      # Set in the Render dashboard, never committed.
      - key: DATABASE_URL
        sync: false

      # Generated by Render and kept out of the repository. Must differ from
      # the development secret.
      - key: AUTH_SECRET
        generateValue: true

      # MUST be the real origin. Every canonical URL, the sitemap and the
      # Open Graph tags are built from it, so a wrong value quietly damages
      # search ranking rather than breaking anything visibly.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # Both on the persistent disk, and both OUTSIDE public/ — anything under
      # public/ is served to anyone who asks, and applicant documents must not be.
      - key: MEDIA_DIR
        value: /var/data/media
      - key: UPLOAD_DIR
        value: /var/data/uploads
